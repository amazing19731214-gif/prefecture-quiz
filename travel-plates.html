'use strict';
const SIGHTS=[{id:'apples',baseSprite:0,name:'青森',label:'りんご園'},{id:'yufuin',baseSprite:1,name:'大分',label:'湯布院'},{id:'takachiho',baseSprite:2,name:'宮崎',label:'高千穂峡'},{id:'fuji',baseSprite:3,name:'山梨',label:'富士山'},{id:'deer',baseSprite:4,name:'奈良',label:'鹿'},{id:'sea',baseSprite:5,name:'沖縄',label:'海'},{id:'castle',baseSprite:6,name:'兵庫',label:'姫路城'},{id:'snow',baseSprite:7,name:'北海道',label:'雪景色'},{id:'torii',name:'広島',label:'鳥居',sprite:0},{id:'lantern',name:'東京',label:'雷門',sprite:1},{id:'buddha',name:'神奈川',label:'大仏',sprite:2},{id:'golden',name:'京都',label:'金閣寺',sprite:3},{id:'cherries',name:'山形',label:'さくらんぼ',sprite:4},{id:'mandarin',name:'愛媛',label:'みかん',sprite:5},{id:'peach',name:'岡山',label:'桃',sprite:6},{id:'tulips',name:'富山',label:'チューリップ',sprite:7},{id:'windmill',name:'長崎',label:'風車',sprite:8},{id:'dunes',name:'鳥取',label:'砂丘',sprite:9},{id:'whirlpool',name:'徳島',label:'渦潮',sprite:10},{id:'shachi',name:'愛知',label:'金鯱',sprite:11}];
const $=id=>document.getElementById(id),sight=id=>SIGHTS.find(s=>s.id===id),KEY='travel-plates-best-v1';
let g=null,state='home',paused=false,lastFrame=0,best=0,soundOn=true,audio=null;
try{best=Math.max(0,Number(localStorage.getItem(KEY))||0);soundOn=localStorage.getItem('kenken-sound')!=='off';}catch(_){}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function img(id){const data=sight(id);let el;if(data.baseSprite!==undefined){el=document.createElement('span');el.className='art sprite clean-'+(data.baseSprite<4?'a':'b');const cell=data.baseSprite%4;el.style.backgroundPosition=(cell%2*100)+'% '+(Math.floor(cell/2)*100)+'%';el.setAttribute('role','img');el.setAttribute('aria-label',data.name+'の'+data.label);}else if(data.sprite!==undefined){el=document.createElement('span');el.className='art sprite';el.style.backgroundPosition=((data.sprite%4)*100/3)+'% '+(Math.floor(data.sprite/4)*50)+'%';el.setAttribute('role','img');el.setAttribute('aria-label',data.name+'の'+data.label);}else{el=document.createElement('img');el.className='art';el.src='assets/trip-'+id+'.webp';el.alt=data.name+'の'+data.label;el.draggable=false;}return el;}

function message(text,warn=false){$('feedback').textContent=text;$('feedback').classList.toggle('warn',warn);}
function tone(notes){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio ||= new C();audio.resume().catch(()=>{});notes.forEach((f,i)=>{const o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime+i*.075;o.frequency.value=f;v.gain.setValueAtTime(.04,t);v.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(v);v.connect(audio.destination);o.start(t);o.stop(t+.15);});}catch(_){}}
function show(id){state=id;['home','game','result'].forEach(s=>$(s).classList.toggle('hidden',s!==id));lastFrame=performance.now();}
function newItem(type){return {uid:g.nextItem++,type};}
function freshType(){const wish=g.orders[Math.floor(Math.random()*g.orders.length)];return Math.random()<.65?wish:SIGHTS[Math.floor(Math.random()*SIGHTS.length)].id;}
function newRound(){if($('gameMenu').open)$('gameMenu').close();document.querySelectorAll('.stock-flight').forEach(el=>el.remove());if($('dialog').open)$('dialog').close();paused=false;const types=shuffle(SIGHTS.map(s=>s.id));g={orders:types.slice(0,4),placed:[[],[],[],[]],stock:[],plates:[],nextItem:1,left:60000,served:[],returned:[],deliveryDue:[0,0,0,0],flying:[],transfers:[],needsDispatch:false};
 const deck=shuffle(SIGHTS.flatMap(s=>Array(g.orders.includes(s.id)?4:5).fill(s.id)));let at=0;
 for(let lane=0;lane<4;lane++)for(let row=0;row<8;row++)g.plates.push({id:lane*8+row,lane,y:-.10+row*.14,items:[0,1,2].map(()=>newItem(deck[at++])),nextItems:[0,1,2].map(()=>newItem(freshType())),ready:0});
 show('game');buildRiver();render();message('どの絵でも取れるよ。注文に合う絵はそのまま上へ！');tone([550]);}
function buildRiver(){const river=$('river');river.replaceChildren();for(const plate of g.plates){const el=document.createElement('div');el.className='plate';el.dataset.plate=plate.id;el.style.setProperty('--lane',plate.lane);for(let slot=0;slot<3;slot++){const b=document.createElement('button');b.type='button';b.className='material';b.dataset.slot=slot;b.onclick=()=>take(plate.id,slot);el.appendChild(b);}const wait=document.createElement('div');wait.className='waiting';wait.setAttribute('aria-label','次に出る皿');el.appendChild(wait);river.appendChild(el);}renderPlates();movePlates();}
function renderPlates(){for(const plate of g.plates){const el=$('river').querySelector('[data-plate="'+plate.id+'"]');el.classList.toggle('is-empty',plate.items.every(v=>!v));[...el.querySelectorAll(':scope > .material')].forEach((b,slot)=>{const item=plate.items[slot];b.replaceChildren();b.disabled=!item;b.setAttribute('aria-label',item?sight(item.type).name+'を注文またはストック皿へ':'空のお皿');if(item){b.dataset.uid=item.uid;b.dataset.type=item.type;b.appendChild(img(item.type));}else{delete b.dataset.uid;delete b.dataset.type;}});const wait=el.querySelector('.waiting');wait.replaceChildren();const label=document.createElement('small');label.textContent='次';wait.appendChild(label);for(const item of plate.nextItems)wait.appendChild(img(item.type));}}
function movePlates(){const height=$('river').clientHeight;for(const p of g.plates){const el=$('river').querySelector('[data-plate="'+p.id+'"]');if(el)el.style.transform='translateY('+(p.y*height)+'px)';}}
function queueStockFlight(item,slot,index,origin=null,kind='order'){
 const source=origin||$('stock').querySelector('[data-uid="'+item.uid+'"] .art')?.getBoundingClientRect();
 if(!source||source.width<=0||source.height<=0)return;
 const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
 const duration=reduced?140:origin?360:500;
 g.transfers.push({uid:item.uid,type:item.type,slot,index,kind,duration,rect:{x:source.x,y:source.y,width:source.width,height:source.height}});
 g.flying.push(item.uid);if(kind==='order')g.deliveryDue[slot]=Math.max(g.deliveryDue[slot]||0,performance.now()+duration+50);
}
function playStockFlights(){
 const game=g,transfers=g.transfers.splice(0);
 for(const flight of transfers){
  const target=flight.kind==='stock'?$('stock').querySelector('[data-uid="'+flight.uid+'"] .art'):$('orders').querySelector('[data-arrival="'+flight.uid+'"]');
  if(!target){g.flying=g.flying.filter(uid=>uid!==flight.uid);continue;}
  const to=target.getBoundingClientRect(),el=img(flight.type);el.classList.add('stock-flight');el.dataset.flightUid=flight.uid;el.dataset.destination=flight.kind;
  Object.assign(el.style,{left:flight.rect.x+'px',top:flight.rect.y+'px',width:flight.rect.width+'px',height:flight.rect.height+'px',transformOrigin:'top left'});document.body.appendChild(el);
  const dx=to.x-flight.rect.x,dy=to.y-flight.rect.y,sx=to.width/flight.rect.width,sy=to.height/flight.rect.height;
  const animation=el.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+(dx*.45)+'px,'+(dy*.5-24)+'px) scale(1.12)',opacity:1,offset:.5},{transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')',opacity:1}],{duration:flight.duration,easing:'cubic-bezier(.2,.65,.25,1)',fill:'forwards'});
  const settle=()=>{el.remove();if(g!==game)return;g.flying=g.flying.filter(uid=>uid!==flight.uid);const landed=document.querySelector('[data-arrival="'+flight.uid+'"]');if(landed){landed.style.visibility='';landed.classList.add('arrived');}g.needsDispatch=true;};
  animation.finished.then(settle).catch(settle);
 }
}

function recordBest(){if(g.served.length>best){best=g.served.length;try{localStorage.setItem(KEY,best);}catch(_){}}}
function fulfill(){
 let count=0;
 for(let guard=0;guard<12;guard++){
  // Anything held for a newly arrived order goes directly onto that order.
  for(let slot=0;slot<4;slot++)while(g.placed[slot].length<3){const at=g.stock.findIndex(v=>v.type===g.orders[slot]&&!g.flying.includes(v.uid));if(at<0)break;const item=g.stock[at];queueStockFlight(item,slot,g.placed[slot].length);g.placed[slot].push(g.stock.splice(at,1)[0]);}
  const slot=g.placed.findIndex((a,i)=>a.length===3&&(g.deliveryDue[i]||0)<=performance.now());if(slot<0)break;
  const type=g.orders[slot],cards=g.placed[slot];g.served.push({type,cards});g.placed[slot]=[];g.deliveryDue[slot]=0;
  const options=SIGHTS.map(s=>s.id).filter(id=>id!==type&&!g.orders.includes(id)),held=options.filter(id=>g.stock.some(v=>v.type===id)),choices=held.length?held:options;
  g.orders[slot]=choices[Math.floor(Math.random()*choices.length)];count++;message('✈️ '+sight(type).name+'の旅をお届け！');
 }
 if(count){recordBest();tone([660,880,1046]);$('river').classList.remove('flash');void $('river').offsetWidth;$('river').classList.add('flash');}return count;
}
function take(plateId,slot){
 if(state!=='game'||paused||document.hidden)return;const p=g.plates.find(p=>p.id===plateId),item=p?.items[slot];if(!item)return;
 const order=g.orders.findIndex((type,i)=>type===item.type&&g.placed[i].length<3);
 if(order<0&&g.stock.length>=5){message('注文にない絵はストックへ。5皿いっぱいなので、絵を押して戻そう。',true);tone([220]);return;}
 const origin=$('river').querySelector('[data-uid="'+item.uid+'"] .art')?.getBoundingClientRect();
 p.items[slot]=null;if(order>=0){const index=g.placed[order].length;g.placed[order].push(item);queueStockFlight(item,order,index,origin,'order');}else{g.stock.push(item);queueStockFlight(item,null,null,origin,'stock');}
 if(p.items.every(v=>!v))p.ready=400;
 if(!fulfill()){message(order>=0?sight(item.type).name+'を注文のお皿へ！':sight(item.type).name+'をストックへ。あと'+(5-g.stock.length)+'皿');tone([440]);}
 render();renderPlates();
}
function returnStock(uid){if(state!=='game'||paused||g.flying.includes(uid))return;const at=g.stock.findIndex(v=>v.uid===uid);if(at<0)return;const [item]=g.stock.splice(at,1);const plate=g.plates.find(p=>p.y>=0&&p.y<.75&&p.items.includes(null))||g.plates.find(p=>p.items.includes(null));if(plate)plate.items[plate.items.indexOf(null)]=item;else g.returned.push(item);message(sight(item.type).name+'を流れるお皿に戻したよ');render();renderPlates();}
function render(){const orders=$('orders');orders.replaceChildren();g.orders.forEach(type=>{const card=document.createElement('div');card.className='order';const images=document.createElement('div');images.className='order-art';const count=g.placed[g.orders.indexOf(type)].length;for(let i=0;i<3;i++){const image=img(type);if(i<count){image.classList.add('have');const item=g.placed[g.orders.indexOf(type)][i];image.dataset.arrival=item.uid;if(g.flying.includes(item.uid))image.style.visibility='hidden';}images.appendChild(image);}const name=document.createElement('small');name.textContent=sight(type).name+'の旅';const n=document.createElement('span');n.className='count';n.textContent=Math.min(count,3)+' / 3';card.append(images,name,n);orders.appendChild(card);});const stock=$('stock');stock.replaceChildren();for(let i=0;i<5;i++){const item=g.stock[i],b=document.createElement('button');b.type='button';b.className='stock-dish'+(item?'':' empty');b.disabled=!item;if(item){b.dataset.uid=item.uid;const picture=img(item.type);picture.dataset.arrival=item.uid;if(g.flying.includes(item.uid))picture.style.visibility='hidden';b.appendChild(picture);const name=document.createElement('span');name.textContent=sight(item.type).name;b.appendChild(name);b.onclick=()=>returnStock(item.uid);b.setAttribute('aria-label',sight(item.type).name+'を流れる皿へ戻す');}else{b.textContent='・';b.setAttribute('aria-label','空きストック皿');}stock.appendChild(b);}$('stockCount').textContent=g.stock.length;$('served').textContent=g.served.length;updateClock();playStockFlights();}
function updateClock(){$('time').textContent=Math.ceil(g.left/1000);$('clock').classList.toggle('urgent',g.left<=10000);}
function step(delta){
 if(state!=='game'||paused||document.hidden)return;const active=Math.max(0,Math.min(delta,1000));let refreshed=false;
 for(const plate of g.plates){plate.y+=active*.000035;while(plate.y>=1)plate.y-=1.12;
  if(plate.items.every(v=>!v)){plate.ready=Math.max(0,plate.ready-active);if(plate.ready===0){plate.items=plate.nextItems;plate.nextItems=[0,1,2].map(()=>g.returned.shift()||newItem(freshType()));refreshed=true;}}
 }
 if(g.needsDispatch||g.deliveryDue.some(t=>t>0&&t<=performance.now())){g.needsDispatch=false;g.deliveryDue=g.deliveryDue.map(t=>t<=performance.now()?0:t);fulfill();render();}if(refreshed)renderPlates();movePlates();updateClock();
}
function finish(){if(state!=='game')return;g.left=0;best=Math.max(best,g.served.length);try{localStorage.setItem(KEY,best);}catch(_){}$('resultCount').textContent=g.served.length+'組';$('resultBest').textContent='ベスト '+best+'組';$('homeBest').textContent='ベスト '+best+'組';show('result');tone([660,880,1046]);}
function openDialog(help=false){paused=state==='game';$('dialogTitle').textContent=help?'遊び方':'ちょっとひと休み';$('dialogCopy').textContent=help?'上の注文は同じ都道府県の絵3つ。下のお皿は上から下へ流れます。1皿の3つの絵は、どれでも自由にタップして取れます。注文に合う絵は上の注文へ直接置きます。注文にない絵だけ、中央のストック皿5個に置きます。各皿には次の3枚が待機しており、今の3枚を取り切ると出てきます。注文の絵が3つ揃うと自動でお届け！ 置き間違えたらストックの絵をタップして戻せます。時間制限はありません。注文へ直接置ける絵を揃え、ストック5皿を使いながら遊びます。':'時計もお皿も止まっています。準備ができたら、つづけよう。';$('dialogClose').textContent=state==='game'?'つづける':'閉じる';if(!$('dialog').open)$('dialog').showModal();}
function closeDialog(){$('dialog').close();paused=false;lastFrame=performance.now();}
function validGame(){if(!g||g.stock.length>5||g.orders.length!==4||new Set(g.orders).size!==4||!g.orders.every(sight)||g.plates.length!==32||g.left<0||g.left>60000)return false;if(!Array.isArray(g.placed)||g.placed.length!==4||g.placed.some((a,i)=>a.length>3||a.some(v=>v.type!==g.orders[i])))return false;const items=[...g.stock,...g.placed.flat(),...g.plates.flatMap(p=>[...p.items.filter(Boolean),...p.nextItems]),...g.returned,...g.served.flatMap(s=>s.cards)];return items.every(v=>sight(v.type))&&new Set(items.map(v=>v.uid)).size===items.length&&g.served.every(v=>v.cards.length===3&&v.cards.every(c=>c.type===v.type));}
function fit(){document.documentElement.style.setProperty('--vh',Math.round(window.visualViewport?.height||innerHeight)+'px');if(g&&state==='game')movePlates();}
function soundLabel(){$('sound').textContent=soundOn?'音 ON ♪':'音 OFF';$('sound').setAttribute('aria-pressed',soundOn);}
let controlOpener=null;
function closeControls(){if($('gameMenu').open)$('gameMenu').close();paused=$('dialog').open;lastFrame=performance.now();}
function controlButton(label,fn,cls=''){const b=document.createElement('button');b.type='button';b.className='control-action '+cls;b.textContent=label;b.onclick=fn;return b;}
function openControls(kind){
 paused=true;controlOpener=kind==='settings'?$('settingsControl'):$('menuControl');const content=$('controlContent');content.replaceChildren();
 const head=document.createElement('div');head.className='control-head';const title=document.createElement('h2');title.id='controlTitle';title.textContent=kind==='settings'?'設定':kind==='restart'?'はじめから遊ぶ？':'メニュー';
 const close=controlButton('×',closeControls,'control-close');close.setAttribute('aria-label','閉じてゲームを続ける');head.append(title,close);content.appendChild(head);
 if(kind==='menu'){
  const score=document.createElement('div');score.className='control-score';score.innerHTML='お届け <b>'+g.served.length+'組</b><small>最高記録 '+Math.max(best,g.served.length)+'組</small>';content.appendChild(score);
  content.append(controlButton('つづける',closeControls,'control-primary'),controlButton('遊び方',()=>{closeControls();openDialog(true);}),controlButton('はじめから',()=>openControls('restart')));
 }else if(kind==='settings'){
  const label=document.createElement('p');label.className='control-copy';label.textContent='効果音';content.appendChild(label);
  const toggle=controlButton('',()=>{soundOn=!soundOn;try{localStorage.setItem('kenken-sound',soundOn?'on':'off');}catch(_){}soundLabel();update();if(soundOn)tone([660,880]);},'sound-switch');toggle.id='soundSwitch';toggle.setAttribute('role','switch');
  function update(){toggle.textContent=soundOn?'音 ON ♪':'音 OFF';toggle.setAttribute('aria-checked',String(soundOn));toggle.classList.toggle('enabled',soundOn);}update();content.append(toggle,controlButton('つづける',closeControls,'control-primary'));
 }else{
  const copy=document.createElement('p');copy.className='control-copy';copy.textContent='今の注文とストックをリセットします。最高記録は残ります。';content.append(copy,controlButton('戻る',()=>openControls('menu')),controlButton('はじめから遊ぶ',newRound,'control-primary'));
 }
 if(!$('gameMenu').open)$('gameMenu').showModal();
}
$('menuControl').onclick=()=>openControls('menu');$('settingsControl').onclick=()=>openControls('settings');
$('gameMenu').addEventListener('close',()=>{paused=$('dialog').open;lastFrame=performance.now();if(!paused&&controlOpener?.isConnected)controlOpener.focus();});
$('start').onclick=newRound;$('again').onclick=newRound;$('back').onclick=()=>show('home');$('pause').onclick=()=>openDialog(false);$('help').onclick=()=>openDialog(true);$('dialogClose').onclick=closeDialog;$('dialog').addEventListener('cancel',()=>{paused=false;lastFrame=performance.now();});$('sound').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('kenken-sound',soundOn?'on':'off');}catch(_){}soundLabel();};window.addEventListener('resize',fit);window.visualViewport?.addEventListener('resize',fit);document.addEventListener('visibilitychange',()=>{lastFrame=performance.now();});
function frame(now){const delta=lastFrame?now-lastFrame:0;lastFrame=now;step(delta);requestAnimationFrame(frame);}fit();soundLabel();$('homeBest').textContent='ベスト '+best+'組';newRound();requestAnimationFrame(frame);
</script></body></html>
