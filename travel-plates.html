<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4e8d8"><title>旅のながれるお皿</title><style>
:root{--vh:100dvh;--ink:#526b60;--green:#498d77;--cream:#fffaf0}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:#ecefe5;touch-action:manipulation}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #58a28c;outline-offset:2px}.hidden{display:none!important}.app{height:var(--vh);max-width:520px;margin:auto;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}header{height:33px;flex:none;display:flex;align-items:center;justify-content:space-between}.brand{font-size:17px;font-weight:850}.brand b{color:var(--green)}.small{border:1px solid #c9d6c0;background:#fffdf4;border-radius:9px;padding:6px 10px;font-size:10px}.screen{flex:1;min-height:0}.home,.result{border:1px solid #d6dcc9;background:var(--cream);border-radius:23px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:23px;gap:15px}h1{font-size:29px;line-height:1.5;margin:0}h1 em{font-style:normal;color:var(--green)}.eyebrow{font-size:9px;letter-spacing:2px;color:#a3997c}.hero{display:flex;gap:7px}.hero img{height:73px;width:73px;object-fit:contain;background:white;border-radius:15px;border:1px solid #e4dcc7}.rules{font-size:12px;line-height:2;color:#8c977f;margin:0}.primary{background:var(--green);border:0;border-radius:13px;box-shadow:0 4px 0 #367762;color:white;font-size:15px;font-weight:750;padding:14px 20px;min-width:210px}.home a,.result a,footer a{color:#849780;font-size:10px}.best{font-size:11px;color:#aa9772}#game{display:grid;grid-template-rows:22px 110px 23px 85px 25px minmax(100px,1fr);gap:6px}.stats{display:flex;align-items:center;justify-content:space-between;font-size:11px}.clock{font-weight:850;background:#e4efda;border-radius:20px;padding:3px 12px;font-variant-numeric:tabular-nums}.clock.urgent{background:#ffe0bb;color:#bc6c3c}.orders-wrap{background:#f1e4dc;border:1px solid #e3d0c4;border-radius:14px;padding:7px;min-height:0;position:relative}.section-label{font-size:9px;color:#a18f76;margin-bottom:4px;display:flex;justify-content:space-between}.orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;height:calc(100% - 16px)}.order{position:relative;border:1px solid #d8c8ad;background:#fffdf3;box-shadow:0 3px 0 #ddcfb8;border-radius:11px;padding:4px;display:flex;flex-direction:column;justify-content:center;min-width:0;gap:3px}.order-art{display:flex;justify-content:center;gap:2px;height:43px}.order img{width:30%;height:100%;object-fit:contain;min-width:0;border-radius:4px;background:white}.order img.have{outline:2px solid #78b18a;outline-offset:-1px}.order small{text-align:center;font-size:9px;white-space:nowrap}.order .count{text-align:center;font-size:8px;color:#a5ad8f}.stock-label{display:flex;justify-content:space-between;align-items:end;font-size:10px;color:#8c9d80;padding:0 3px}.stock-label small{font-size:8px}.stock{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;min-height:0;padding:6px;border:1px solid #d2bb95;border-radius:12px;background:repeating-linear-gradient(0deg,#ead9b9 0 7px,#e6d4b0 8px 9px);box-shadow:0 3px 0 #d7c199}.stock-dish{border:1px solid #e0d6bd;border-radius:11px;background:#fffdf5;box-shadow:inset 0 0 0 3px #f2ecdc,0 2px 0 #d1bd9b;padding:4px;min-height:0;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}.stock-dish img{width:100%;flex:1;min-height:0;object-fit:contain;background:white;border-radius:5px}.stock-dish span{font-size:8px;line-height:13px;white-space:nowrap;color:#9a9d83}.stock-dish.empty{color:#c6c3ab;font-size:13px;cursor:default}.stock-dish:not(.empty):active{transform:scale(.93)}.feedback{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--green);text-align:center;line-height:1.3}.feedback.warn{color:#b08448}.river{position:relative;min-height:0;overflow:hidden;border:1px solid #d9d4bc;border-radius:15px;background:repeating-linear-gradient(90deg,#e5eddf 0 calc(33.333% - 1px),#cfdac7 calc(33.333% - 1px) 33.333%);isolation:isolate}.river:before{content:'↓　　　↓　　　↓';position:absolute;inset:0;text-align:center;font-size:25px;letter-spacing:10px;color:#c4d5bd;pointer-events:none}.river:after{content:'';position:absolute;inset:0;box-shadow:inset 0 11px 12px -10px #64755755,inset 0 -12px 12px -10px #64755755;pointer-events:none;z-index:20}.plate{position:absolute;top:0;width:calc(33.333% - 10px);left:calc(var(--lane)*33.333% + 5px);height:28%;border:1px solid #d0b68d;border-radius:12px;background:#f4dfb9;box-shadow:inset 0 0 0 4px #efcca1,0 3px 0 #c7b28c;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;padding:7px 5px;gap:1px;will-change:transform}.material{border:0;background:#fffaf0;border-radius:6px;padding:1px;min-width:0;height:80%;max-height:70px;display:flex;align-items:center;justify-content:center}.material img{height:100%;width:100%;object-fit:contain;pointer-events:none;border-radius:4px}.material:active{transform:scale(.88);background:#e3f2d7}.material:disabled{background:#e7cda8;opacity:.55;cursor:default}.plate.is-empty{opacity:.4}.river.flash{animation:clean .5s ease-out}@keyframes clean{50%{background:#fff5c9}}.result-number{font-size:64px;font-weight:850;color:var(--green);line-height:1}.result p{margin:0;font-size:12px;color:#9aa187}footer{text-align:center;font-size:9px;flex:none;height:14px;color:#a5ae98}dialog{width:min(390px,calc(100vw - 30px));border:1px solid #cbd8be;border-radius:19px;background:#fffdf1;color:var(--ink);padding:21px}dialog::backdrop{background:#354d3c66}dialog h2{font-size:19px;margin:0 0 12px}dialog p{font-size:12px;line-height:1.9}dialog .dialog-actions{display:flex;gap:8px;justify-content:flex-end}.stamp{display:inline-block;background:#edf4e4;border-radius:20px;padding:5px 12px;font-size:10px;color:#789574}
@media(max-height:650px){.app{gap:5px}header{height:28px}#game{grid-template-rows:20px 92px 19px 72px 23px minmax(90px,1fr);gap:5px}.order-art{height:33px}.order small{font-size:8px}.order .count{font-size:7px}.stock-dish span{font-size:7px}.brand{font-size:15px}.hero img{width:60px;height:60px}h1{font-size:25px}.home,.result{gap:11px;padding:15px}.rules{font-size:11px}.plate{padding:5px 4px}}
@media(max-height:510px){#game{grid-template-rows:18px 74px 17px 57px 21px minmax(80px,1fr);gap:4px}.app{padding-top:5px;padding-bottom:5px;gap:4px}header{height:25px}.order-art{height:24px}.order small{font-size:7px}.orders-wrap{padding:4px}.section-label{font-size:8px}.order{padding:2px;gap:1px}.feedback{font-size:9px}.stock{padding:4px}.stock-dish{padding:3px}.stock-dish span{line-height:10px}.plate{border-radius:8px;padding:4px}.hero img{width:45px;height:45px}.home,.result{gap:8px}h1{font-size:22px}.rules{font-size:10px;line-height:1.8}.primary{padding:11px 17px}footer{height:11px}}
@media(orientation:landscape) and (min-width:650px) and (max-height:510px){.app{max-width:1000px}#game{grid-template-columns:1fr 1fr;grid-template-rows:22px 100px 20px 78px 25px;grid-template-areas:'stats river' 'orders river' 'label river' 'stock river' 'feedback river';gap:6px 13px}.stats{grid-area:stats}.orders-wrap{grid-area:orders}.stock-label{grid-area:label}.stock{grid-area:stock}.feedback{grid-area:feedback}.river{grid-area:river}.order-art{height:38px}.order small{font-size:10px}.home .hero{display:none}.home{gap:7px}.rules{line-height:1.7}}
@media(prefers-reduced-motion:reduce){.river.flash{animation:none}}
.plate{align-items:start}.plate>.material{height:65%;margin-top:0}.waiting{position:absolute;bottom:4px;left:5px;right:5px;height:25%;display:flex;align-items:center;justify-content:center;gap:3px;border:1px solid #d1ba98;border-radius:5px;background:#ebd2ad;pointer-events:none}.waiting img{height:100%;width:23%;object-fit:contain;background:#fff9ec;border-radius:3px;opacity:.85}.waiting small{font-size:7px;color:#a18d6c}.order img:not(.have){opacity:.35}.order img.have{opacity:1}.order small{font-weight:700}
</style></head><body><main class="app"><header><div class="brand">旅の<b>ながれるお皿</b> 🍽️</div><div><button id="sound" class="small" aria-pressed="true">音 ON ♪</button> <button id="help" class="small">？</button></div></header>
<section id="home" class="screen home"><div class="eyebrow">PICK THREE. SEND A JOURNEY.</div><h1>同じ旅を3つ。<br><em>そろえて、お届け。</em></h1><div class="hero"><img src="assets/trip-sea.webp" alt="沖縄の海"><img src="assets/trip-castle.webp" alt="姫路城"><img src="assets/trip-snow.webp" alt="北海道の雪景色"></div><p class="rules">上は「同じ絵3つ」の注文。<br>注文に合う絵は、そのまま上へ！<br>注文にない絵だけ、真ん中の5皿へ。<br>注文の3つがそろうと自動でお届け！</p><button id="start" class="primary">60秒、お店を開く →</button><span id="homeBest" class="best">ベスト 0組</span><a href="travel.html">元の旅行ゲームへ</a></section>
<section id="game" class="screen hidden" aria-label="同じ都道府県の絵を3つ揃えるゲーム"><div class="stats"><span>お届け <b id="served">0</b>組</span><span id="clock" class="clock">⏱ <b id="time">60</b>秒</span><button id="pause" class="small">一時停止</button></div><div class="orders-wrap"><div class="section-label"><span>ご注文 · 同じ旅を3つ</span><span>そろうと自動でお届け</span></div><div id="orders" class="orders" aria-label="3組の注文"></div></div><div class="stock-label"><span>注文にない絵 <b id="stockCount">0</b> / 5</span><small>置いた絵を押すと戻せます</small></div><div id="stock" class="stock" aria-label="5個のストック皿"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div id="river" class="river" aria-label="上から下へ流れる皿。1皿に3つ、どの絵でも取れます"></div></section>
<section id="result" class="screen result hidden"><div class="eyebrow">THANK YOU FOR YOUR JOURNEYS!</div><h1>おつかれさま！</h1><div id="resultCount" class="result-number">0組</div><p>旅をお届けしました</p><span id="resultBest" class="stamp"></span><button id="again" class="primary">もう一度、お店を開く →</button><button id="back" class="small">入口へ</button><a href="travel.html">元の旅行ゲームへ</a></section>
<footer>上の注文に合わせて、好きな絵を選ぼう。</footer></main>
<dialog id="dialog"><h2 id="dialogTitle">遊び方</h2><p id="dialogCopy"></p><div class="dialog-actions"><button id="dialogClose" class="small">つづける</button></div></dialog>
<script>
'use strict';
const SIGHTS=[{id:'apples',name:'青森',label:'りんご園'},{id:'yufuin',name:'大分',label:'湯布院'},{id:'takachiho',name:'宮崎',label:'高千穂峡'},{id:'fuji',name:'山梨',label:'富士山'},{id:'deer',name:'奈良',label:'鹿'},{id:'sea',name:'沖縄',label:'海'},{id:'castle',name:'兵庫',label:'姫路城'},{id:'snow',name:'北海道',label:'雪景色'}];
const $=id=>document.getElementById(id),sight=id=>SIGHTS.find(s=>s.id===id),KEY='travel-plates-best-v1';
let g=null,state='home',paused=false,lastFrame=0,best=0,soundOn=true,audio=null;
try{best=Math.max(0,Number(localStorage.getItem(KEY))||0);soundOn=localStorage.getItem('kenken-sound')!=='off';}catch(_){}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function img(id){const el=document.createElement('img');el.src='assets/trip-'+id+'.webp';el.alt=sight(id).name+'の'+sight(id).label;el.draggable=false;return el;}
function message(text,warn=false){$('feedback').textContent=text;$('feedback').classList.toggle('warn',warn);}
function tone(notes){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio ||= new C();audio.resume().catch(()=>{});notes.forEach((f,i)=>{const o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime+i*.075;o.frequency.value=f;v.gain.setValueAtTime(.04,t);v.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(v);v.connect(audio.destination);o.start(t);o.stop(t+.15);});}catch(_){}}
function show(id){state=id;['home','game','result'].forEach(s=>$(s).classList.toggle('hidden',s!==id));lastFrame=performance.now();}
function newItem(type){return {uid:g.nextItem++,type};}
function freshType(){const wish=g.orders[Math.floor(Math.random()*g.orders.length)];return Math.random()<.65?wish:SIGHTS[Math.floor(Math.random()*8)].id;}
function newRound(){if($('dialog').open)$('dialog').close();paused=false;const types=shuffle(SIGHTS.map(s=>s.id));g={orders:types.slice(0,3),placed:[[],[],[]],stock:[],plates:[],nextItem:1,left:60000,served:[],returned:[]};
 const deck=shuffle(SIGHTS.flatMap(s=>Array(g.orders.includes(s.id)?4:3).fill(s.id)));let at=0;
 for(let lane=0;lane<3;lane++)for(let row=0;row<3;row++)g.plates.push({id:lane*3+row,lane,y:-.18+row*.36,items:[0,1,2].map(()=>newItem(deck[at++])),nextItems:[0,1,2].map(()=>newItem(freshType())),ready:0});
 show('game');buildRiver();render();message('どの絵でも取れるよ。注文に合う絵はそのまま上へ！');tone([550]);}
function buildRiver(){const river=$('river');river.replaceChildren();for(const plate of g.plates){const el=document.createElement('div');el.className='plate';el.dataset.plate=plate.id;el.style.setProperty('--lane',plate.lane);for(let slot=0;slot<3;slot++){const b=document.createElement('button');b.type='button';b.className='material';b.dataset.slot=slot;b.onclick=()=>take(plate.id,slot);el.appendChild(b);}const wait=document.createElement('div');wait.className='waiting';wait.setAttribute('aria-label','次に出る皿');el.appendChild(wait);river.appendChild(el);}renderPlates();movePlates();}
function renderPlates(){for(const plate of g.plates){const el=$('river').querySelector('[data-plate="'+plate.id+'"]');el.classList.toggle('is-empty',plate.items.every(v=>!v));[...el.querySelectorAll(':scope > .material')].forEach((b,slot)=>{const item=plate.items[slot];b.replaceChildren();b.disabled=!item;b.setAttribute('aria-label',item?sight(item.type).name+'を注文またはストック皿へ':'空のお皿');if(item){b.dataset.uid=item.uid;b.dataset.type=item.type;b.appendChild(img(item.type));}else{delete b.dataset.uid;delete b.dataset.type;}});const wait=el.querySelector('.waiting');wait.replaceChildren();const label=document.createElement('small');label.textContent='次';wait.appendChild(label);for(const item of plate.nextItems)wait.appendChild(img(item.type));}}
function movePlates(){const height=$('river').clientHeight;for(const p of g.plates){const el=$('river').querySelector('[data-plate="'+p.id+'"]');if(el)el.style.transform='translateY('+(p.y*height)+'px)';}}
function fulfill(){
 let count=0;
 for(let guard=0;guard<12;guard++){
  // Anything held for a newly arrived order goes directly onto that order.
  for(let slot=0;slot<3;slot++)while(g.placed[slot].length<3){const at=g.stock.findIndex(v=>v.type===g.orders[slot]);if(at<0)break;g.placed[slot].push(g.stock.splice(at,1)[0]);}
  const slot=g.placed.findIndex(a=>a.length===3);if(slot<0)break;
  const type=g.orders[slot],cards=g.placed[slot];g.served.push({type,cards});g.placed[slot]=[];
  const options=SIGHTS.map(s=>s.id).filter(id=>id!==type&&!g.orders.includes(id)),held=options.filter(id=>g.stock.some(v=>v.type===id)),choices=held.length?held:options;
  g.orders[slot]=choices[Math.floor(Math.random()*choices.length)];count++;message('✈️ '+sight(type).name+'の旅をお届け！');
 }
 if(count){tone([660,880,1046]);$('river').classList.remove('flash');void $('river').offsetWidth;$('river').classList.add('flash');}return count;
}
function take(plateId,slot){
 if(state!=='game'||paused||document.hidden)return;const p=g.plates.find(p=>p.id===plateId),item=p?.items[slot];if(!item)return;
 const order=g.orders.findIndex((type,i)=>type===item.type&&g.placed[i].length<3);
 if(order<0&&g.stock.length>=5){message('注文にない絵はストックへ。5皿いっぱいなので、絵を押して戻そう。',true);tone([220]);return;}
 p.items[slot]=null;if(order>=0)g.placed[order].push(item);else g.stock.push(item);
 if(p.items.every(v=>!v))p.ready=400;
 if(!fulfill()){message(order>=0?sight(item.type).name+'を注文のお皿へ！':sight(item.type).name+'をストックへ。あと'+(5-g.stock.length)+'皿');tone([440]);}
 render();renderPlates();
}
function returnStock(uid){if(state!=='game'||paused)return;const at=g.stock.findIndex(v=>v.uid===uid);if(at<0)return;const [item]=g.stock.splice(at,1);const plate=g.plates.find(p=>p.y>=0&&p.y<.75&&p.items.includes(null))||g.plates.find(p=>p.items.includes(null));if(plate)plate.items[plate.items.indexOf(null)]=item;else g.returned.push(item);message(sight(item.type).name+'を流れるお皿に戻したよ');render();renderPlates();}
function render(){const orders=$('orders');orders.replaceChildren();g.orders.forEach(type=>{const card=document.createElement('div');card.className='order';const images=document.createElement('div');images.className='order-art';const count=g.placed[g.orders.indexOf(type)].length;for(let i=0;i<3;i++){const image=img(type);if(i<count)image.className='have';images.appendChild(image);}const name=document.createElement('small');name.textContent=sight(type).name+'の旅';const n=document.createElement('span');n.className='count';n.textContent=Math.min(count,3)+' / 3';card.append(images,name,n);orders.appendChild(card);});const stock=$('stock');stock.replaceChildren();for(let i=0;i<5;i++){const item=g.stock[i],b=document.createElement('button');b.type='button';b.className='stock-dish'+(item?'':' empty');b.disabled=!item;if(item){b.dataset.uid=item.uid;b.appendChild(img(item.type));const name=document.createElement('span');name.textContent=sight(item.type).name;b.appendChild(name);b.onclick=()=>returnStock(item.uid);b.setAttribute('aria-label',sight(item.type).name+'を流れる皿へ戻す');}else{b.textContent='・';b.setAttribute('aria-label','空きストック皿');}stock.appendChild(b);}$('stockCount').textContent=g.stock.length;$('served').textContent=g.served.length;updateClock();}
function updateClock(){$('time').textContent=Math.ceil(g.left/1000);$('clock').classList.toggle('urgent',g.left<=10000);}
function step(delta){
 if(state!=='game'||paused||document.hidden)return;const active=Math.min(Math.max(0,delta),g.left);g.left=Math.max(0,g.left-active);let refreshed=false;
 for(const plate of g.plates){plate.y+=active*.000055;while(plate.y>=1)plate.y-=1.08;
  if(plate.items.every(v=>!v)){plate.ready=Math.max(0,plate.ready-active);if(plate.ready===0){plate.items=plate.nextItems;plate.nextItems=[0,1,2].map(()=>g.returned.shift()||newItem(freshType()));refreshed=true;}}
 }
 if(refreshed)renderPlates();movePlates();updateClock();if(g.left===0)finish();
}
function finish(){if(state!=='game')return;g.left=0;best=Math.max(best,g.served.length);try{localStorage.setItem(KEY,best);}catch(_){}$('resultCount').textContent=g.served.length+'組';$('resultBest').textContent='ベスト '+best+'組';$('homeBest').textContent='ベスト '+best+'組';show('result');tone([660,880,1046]);}
function openDialog(help=false){paused=state==='game';$('dialogTitle').textContent=help?'遊び方':'ちょっとひと休み';$('dialogCopy').textContent=help?'上の注文は同じ都道府県の絵3つ。下のお皿は上から下へ流れます。1皿の3つの絵は、どれでも自由にタップして取れます。注文に合う絵は上の注文へ直接置きます。注文にない絵だけ、中央のストック皿5個に置きます。各皿には次の3枚が待機しており、今の3枚を取り切ると出てきます。注文の絵が3つ揃うと自動でお届け！ 置き間違えたらストックの絵をタップして戻せます。60秒で何組案内できるか挑戦。画面を離れている間も時計は止まります。':'時計もお皿も止まっています。準備ができたら、つづけよう。';$('dialogClose').textContent=state==='game'?'つづける':'閉じる';if(!$('dialog').open)$('dialog').showModal();}
function closeDialog(){$('dialog').close();paused=false;lastFrame=performance.now();}
function validGame(){if(!g||g.stock.length>5||g.orders.length!==3||new Set(g.orders).size!==3||!g.orders.every(sight)||g.plates.length!==9||g.left<0||g.left>60000)return false;if(!Array.isArray(g.placed)||g.placed.length!==3||g.placed.some((a,i)=>a.length>2||a.some(v=>v.type!==g.orders[i])))return false;const items=[...g.stock,...g.placed.flat(),...g.plates.flatMap(p=>[...p.items.filter(Boolean),...p.nextItems]),...g.returned,...g.served.flatMap(s=>s.cards)];return items.every(v=>sight(v.type))&&new Set(items.map(v=>v.uid)).size===items.length&&g.served.every(v=>v.cards.length===3&&v.cards.every(c=>c.type===v.type));}
function fit(){document.documentElement.style.setProperty('--vh',Math.round(window.visualViewport?.height||innerHeight)+'px');if(g&&state==='game')movePlates();}
function soundLabel(){$('sound').textContent=soundOn?'音 ON ♪':'音 OFF';$('sound').setAttribute('aria-pressed',soundOn);}
