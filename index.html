<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>都道府県 文字縛りクイズ｜30秒チャレンジ</title>
    <style>
        :root {
            --primary: #FF5722;
            --primary-dark: #E64A19;
            --secondary: #00897B;
            --bg-color: #FFF3E0;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --gray-light: #F5F5F5;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin: 16px;
        }

        .screen {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        /* スタート・リザルト画面 */
        h1 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(255, 87, 34, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn:active {
            transform: scale(0.97);
            background-color: var(--primary-dark);
        }

        /* ゲーム画面ヘッダー */
        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #555;
        }

        .timer-box {
            background: #FFE0B2;
            color: #E65100;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .score-box {
            background: #E0F2F1;
            color: #00695C;
            padding: 6px 14px;
            border-radius: 20px;
        }

        /* 問題カード */
        .question-card {
            background: #FAFAFA;
            border: 2px dashed #FFCCBC;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            line-height: 1.4;
        }

        /* 4択ボタン */
        .choices-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            color: #444;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .choice-btn:hover {
            border-color: var(--primary);
            background: #FFFBE6;
        }

        .choice-btn.correct {
            background: #4CAF50 !important;
            color: white !important;
            border-color: #4CAF50 !important;
        }

        .choice-btn.incorrect {
            background: #F44336 !important;
            color: white !important;
            border-color: #F44336 !important;
        }

        /* リザルト画面 */
        .result-score {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }
    
        * { box-sizing: border-box; }
        button { touch-action: manipulation; }
        button:focus-visible { outline: 3px solid #1976D2; outline-offset: 3px; }
        .choice-btn:disabled { cursor: default; opacity: 1; }
        .sound-bar { display:flex; justify-content:flex-end; padding:14px 18px 0; }
        .small-btn { border:1px solid #ddd; background:#fffaf2; border-radius:12px; padding:8px 12px; font:inherit; font-size:12px; cursor:pointer; }
        .game-header { flex-wrap:wrap; gap:8px; font-size:14px; }
        .feedback { min-height:66px; padding:12px 0 0; font-size:13px; line-height:1.6; font-weight:700; color:#00796B; }
        .feedback.wrong { color:#C62828; }
        .best { font-size:14px; margin:20px 0 0; color:#777; }
        .timer-box.urgent { background:#FFEBEE; color:#C62828; }
        .record { color:#00796B; font-weight:700; margin-bottom:20px; }
        .question-card { min-height:116px; display:flex; align-items:center; justify-content:center; }
        .screen { width:100%; }
        .paused { padding:30px 0; }
        .paused p { margin:0 0 20px; }
        @media(max-height:720px) { .screen { padding:18px; } .choice-btn { padding:13px; } .question-card { padding:15px; min-height:90px; margin-bottom:15px; } }
    </style>
</head>
<body>

    <div class="container"><div class="sound-bar"><button id="sound" class="small-btn" aria-pressed="true">音 ON ♪</button></div>
        <!-- スタート画面 -->
        <div id="start-screen" class="screen">
            <h1>日本全国<br>文字縛りクイズ</h1>
            <p>制限時間30秒！4択をタップして答えよう。<br>正解のピンポン♪で、テンポよく次へ。<br><small>文字の問題は「都・道・府・県」を除いて考えてね。</small></p>
            <button id="start" class="btn">ゲームスタート</button><p class="best">自己ベスト：<b id="home-best">0</b>問正解</p>
        </div>

        <!-- ゲーム画面 -->
        <div id="game-screen" class="screen hidden">
            <div class="game-header">
                <div id="timer-box" class="timer-box">残り時間: <span id="time-left">30</span>秒</div>
                <div class="score-box">正解: <span id="current-score">0</span>問</div><button id="pause" class="small-btn">一時停止</button>
            </div>

            <div id="play-content"><div class="question-card">
                <div id="question-text" class="question-text">ここに問題文が入ります</div>
            </div>

            <div class="choices-container" id="choices-container">
                <!-- 選択肢ボタンが動的に入ります -->
            </div><div id="feedback" class="feedback" role="status" aria-live="polite"></div></div><div id="paused" class="paused hidden"><h2>ひとやすみ</h2><p>残り時間も止まっています。</p><button id="resume" class="btn">つづける</button></div>
        </div>

        <!-- リザルト画面 -->
        <div id="result-screen" class="screen hidden">
            <h1>タイムアップ！</h1>
            <p>お疲れ様でした！あなたのスコアは...</p>
            <div class="result-score"><span id="final-score">0</span>問正解</div>
            <p id="record" class="record"></p><p id="result-comment" style="font-weight: bold; color: #333;"></p>
            <button id="replay" class="btn">もう一度プレイ</button>
        </div>
    </div>

    <script>
'use strict';
const quizData=[["「あ」から始まり、日本海に面している県は？",["愛知県","愛媛県","秋田県","静岡県"],2,"秋田県は日本海に面しています。"],["県名の読みが「ま」で終わるのは？",["埼玉県","新潟県","長野県","滋賀県"],0,"さいたま、の最後は「ま」です。"],["「か」から始まり、九州地方にある県は？",["神奈川県","鹿児島県","香川県","京都府"],1,"かごしま県は九州地方です。"],["名前に「川」がつき、北陸地方にある県は？",["東京都","神奈川県","石川県","香川県"],2,"石川県は北陸地方にあります。"],["名前に漢字の「島」がつく都道府県はいくつ？",["3つ","4つ","5つ","6つ"],2,"福島・島根・広島・徳島・鹿児島の5つです。"],["名前に漢字の「山」がつく都道府県はいくつ？",["3つ","5つ","6つ","8つ"],2,"山形・山梨・富山・和歌山・岡山・山口の6つです。"],["県庁所在地が甲府市なのは？",["青森県","秋田県","山梨県","富山県"],2,"山梨県の県庁所在地は甲府市です。"],["島根県と陸地で隣り合っていないのは？",["鳥取県","広島県","山口県","香川県"],3,"香川県は四国地方にあります。"],["京都府のほかに、名前に「府」がつくのは？",["大阪府","東京都","北海道","兵庫県"],0,"「府」がつくのは京都府と大阪府です。"],["「お」から始まり、中国地方にある県は？",["岡山県","大分県","沖縄県","大阪府"],0,"おかやま県は中国地方です。"],["「と」から始まり、海に面していないのは？",["東京都","徳島県","栃木県","富山県"],2,"栃木県は内陸県です。"],["九州地方にあるのは？",["佐賀県","山口県","愛媛県","新潟県"],0,"佐賀県は九州地方です。"],["四国地方に含まれないのは？",["徳島県","香川県","岡山県","高知県"],2,"岡山県は中国地方です。"],["東北地方に含まれないのは？",["新潟県","青森県","岩手県","福島県"],0,"新潟県は中部地方に分類されます。"],["「み」から始まる都道府県は？",["宮城県","山形県","茨城県","鳥取県"],0,"宮城県は「みやぎ」と読みます。"],["「ふ」から始まる都道府県は？",["福井県","富山県","愛媛県","兵庫県"],0,"福井県は「ふくい」と読みます。"],["名前に漢字の「岡」がつく県は？",["山形県","長野県","福岡県","福島県"],2,"福岡県・静岡県・岡山県に「岡」がつきます。"],["県名の読みが「わ」で終わるのは？",["和歌山県","沖縄県","岩手県","滋賀県"],1,"おきなわ、の最後は「わ」です。"],["「ぐ」から始まる都道府県は？",["岐阜県","群馬県","熊本県","宮崎県"],1,"群馬県は「ぐんま」と読みます。"],["名前に漢字の「長」がつく県は？",["鳥取県","奈良県","長崎県","宮崎県"],2,"長崎県と長野県に「長」がつきます。"],["金沢市が県庁所在地なのは？",["石川県","香川県","神奈川県","福井県"],0,"石川県の県庁所在地は金沢市です。"],["日本で面積が最も小さい都道府県は？",["沖縄県","香川県","大阪府","東京都"],1,"香川県が最も小さい都道府県です。"],["名前に漢字の「愛」がつく県は？",["岐阜県","三重県","愛媛県","奈良県"],2,"愛媛県と愛知県に「愛」がつきます。"],["県名の読みが「ぎ」で終わるのは？",["宮崎県","栃木県","山口県","高知県"],1,"栃木県は「とちぎ」と読みます。"]];
const $=id=>document.getElementById(id);
const LIMIT=30000,KEY='prefecture-four-choice-best-v1';
let best=0,soundOn=true,audio=null;
try{const value=Number(localStorage.getItem(KEY));best=Number.isFinite(value)&&value>0?value:0;soundOn=localStorage.getItem('kenken-sound')!=='off';}catch(_){}
function save(key,value){try{localStorage.setItem(key,String(value));}catch(_){}}
function updateSound(){$('sound').textContent=soundOn?'音 ON ♪':'音 OFF';$('sound').setAttribute('aria-pressed',String(soundOn));}
function prepareAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!audio)audio=new C();if(audio.state!=='running')audio.resume().catch(()=>{});return audio;}catch(_){return null;}}
function correctSound(){
 if(!soundOn)return;const ctx=prepareAudio();if(!ctx)return;
 const play=()=>{try{[880,660].forEach((hz,i)=>{const oscillator=ctx.createOscillator(),gain=ctx.createGain(),t=ctx.currentTime+i*.18;oscillator.frequency.value=hz;gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.18,t+.008);gain.gain.exponentialRampToValueAtTime(.001,t+.24);oscillator.connect(gain);gain.connect(ctx.destination);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};oscillator.start(t);oscillator.stop(t+.25);});}catch(_){}};
 if(ctx.state==='running')play();else ctx.resume().then(play).catch(()=>{});
}
function shuffle(items,random=Math.random){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}return copy;}
function buildQuestion(entry){const choices=shuffle(entry[1].map((label,index)=>({label,correct:index===entry[2]})));return {text:entry[0],choices,explanation:entry[3]};}
let state='home',score=0,attempts=0,remaining=LIMIT,last=0,raf=0,deck=[],current=null,phase='question',feedbackLeft=0,previousEntry=null,lastError='';
function screen(id){['start-screen','game-screen','result-screen'].forEach(s=>$(s).classList.toggle('hidden',s!==id));}
function updateClock(){$('time-left').textContent=Math.ceil(remaining/1000);$('timer-box').classList.toggle('urgent',remaining<=5000);}
function startGame(){
 cancelAnimationFrame(raf);prepareAudio();score=attempts=0;remaining=LIMIT;deck=[];current=null;previousEntry=null;lastError='';state='playing';
 $('current-score').textContent=0;$('paused').classList.add('hidden');$('play-content').classList.remove('hidden');screen('game-screen');updateClock();nextQuestion();last=performance.now();raf=requestAnimationFrame(tick);
}
function nextQuestion(){
 if(!deck.length){deck=shuffle(quizData);if(deck[deck.length-1]===previousEntry&&deck.length>1)[deck[0],deck[deck.length-1]]=[deck[deck.length-1],deck[0]];}
 const entry=deck.pop();previousEntry=entry;current=buildQuestion(entry);phase='question';
 $('question-text').textContent=current.text;$('feedback').textContent='';$('feedback').classList.remove('wrong');
 const container=$('choices-container');container.replaceChildren();
 current.choices.forEach((choice,index)=>{const button=document.createElement('button');button.className='choice-btn';button.textContent=choice.label;button.onclick=()=>answer(index);container.appendChild(button);});
}
function advance(now){
 if(state!=='playing')return;
 const delta=Math.max(0,now-last);last=now;remaining=Math.max(0,remaining-delta);updateClock();
 if(remaining<=0){endGame();return;}
 if(phase==='feedback'){feedbackLeft-=delta;if(feedbackLeft<=0)nextQuestion();}
}
function tick(now){if(state!=='playing')return;advance(now);if(state==='playing')raf=requestAnimationFrame(tick);}
function answer(index){
 if(state!=='playing'||phase!=='question')return;
 advance(performance.now());if(state!=='playing'||phase!=='question')return;
 const good=current.choices[index].correct;phase='feedback';attempts++;
 const buttons=$('choices-container').children;
 current.choices.forEach((choice,i)=>{buttons[i].disabled=true;if(choice.correct)buttons[i].classList.add('correct');else if(i===index)buttons[i].classList.add('incorrect');});
 if(good){score++;$('current-score').textContent=score;$('feedback').textContent='正解！';correctSound();feedbackLeft=350;}
 else{lastError=current.explanation;$('feedback').textContent='正解は「'+current.choices.find(c=>c.correct).label+'」。'+current.explanation;$('feedback').classList.add('wrong');feedbackLeft=1250;}
}
function endGame(){
 if(state!=='playing')return;state='result';cancelAnimationFrame(raf);screen('result-screen');$('final-score').textContent=score;
 const oldBest=best;if(score>best){best=score;save(KEY,best);}
 $('record').textContent=score>oldBest?'自己ベスト更新！ '+best+'問正解':best>0?'自己ベスト：'+best+'問 ／ 更新まであと'+(best-score+1)+'問':'まずは1問正解を目指そう！';
 $('result-comment').textContent=attempts?'正答率 '+Math.round(score/attempts*100)+'%'+(lastError?' ／ おさらい：'+lastError:' ／ 全問正解！'):'お疲れさまでした。準備ができたらもう一度！';
 $('home-best').textContent=best;$('replay').focus();
}
function pause(){
 if(state!=='playing')return;advance(performance.now());if(state!=='playing')return;state='paused';cancelAnimationFrame(raf);$('play-content').classList.add('hidden');$('paused').classList.remove('hidden');$('resume').focus();
}
function resume(){if(state!=='paused')return;prepareAudio();state='playing';$('paused').classList.add('hidden');$('play-content').classList.remove('hidden');last=performance.now();raf=requestAnimationFrame(tick);}
$('start').onclick=startGame;$('replay').onclick=startGame;$('pause').onclick=pause;$('resume').onclick=resume;
$('sound').onclick=()=>{soundOn=!soundOn;save('kenken-sound',soundOn?'on':'off');updateSound();if(soundOn)correctSound();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Escape'){if(state==='playing')pause();else if(state==='paused')resume();}else if(state==='playing'&&/^[1-4]$/.test(e.key)){e.preventDefault();answer(Number(e.key)-1);}});
$('home-best').textContent=best;updateSound();
</script>
</body>
</html>
